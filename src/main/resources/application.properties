# Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# Database
# Production can override these with the Render Postgres JDBC URL/user/password.
# Without external DB credentials Oly boots safely on an in-memory H2 database.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:oly;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA
# Liquibase is the schema authority. Set JPA_DDL_AUTO=validate explicitly when desired.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Oly AI providers
# OLY_AI_PROVIDER can be "openai" or "gemini".
oly.ai.enabled=${OLY_AI_ENABLED:true}
oly.ai.provider=${OLY_AI_PROVIDER:openai}

# OpenAI Responses API
oly.ai.api-key=${OPENAI_API_KEY:}
oly.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
oly.ai.model=${OPENAI_MODEL:gpt-5.6-terra}
oly.ai.web-search-enabled=${OLY_WEB_SEARCH_ENABLED:true}

# Gemini OpenAI-compatible Chat Completions API.
# Accept common secret names so a Render key does not fail only because it was named differently.
oly.ai.gemini-api-key=${GEMINI_API_KEY:${GOOGLE_GEMINI_API_KEY:${GOOGLE_API_KEY:${GEMINI_KEY:${GEMINI:${gemini:}}}}}}
oly.ai.gemini-base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
oly.ai.gemini-model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Multimodal Telegram media.
# openrouter/free automatically filters for compatible free models for image/video understanding.
# Image generation uses OpenRouter's dedicated /images endpoint and may consume paid OpenRouter credits.
oly.media.enabled=${OLY_MEDIA_ENABLED:true}
oly.media.vision-model=${OLY_VISION_MODEL:openrouter/free}
oly.media.video-model=${OLY_VIDEO_MODEL:openrouter/free}
oly.media.image-generation-enabled=${OLY_IMAGE_GENERATION_ENABLED:true}
oly.media.image-model=${OLY_IMAGE_MODEL:google/gemini-2.5-flash-image}
# Telegram Bot API getFile currently caps bot downloads at 20 MB; keep a little headroom.
oly.media.max-download-bytes=${OLY_MEDIA_MAX_DOWNLOAD_BYTES:19000000}

oly.timezone=${OLY_TIMEZONE:Europe/Amsterdam}

# Logging
logging.level.com.example.helper_bot_oly=${LOG_LEVEL:INFO}
logging.level.org.springframework.boot.autoconfigure.liquibase=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server
# Render injects PORT. SERVER_PORT remains useful for local runs.
server.port=${PORT:${SERVER_PORT:8082}}
server.address=0.0.0.0
server.shutdown=graceful
