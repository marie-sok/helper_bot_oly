# Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/telegram_bot}
spring.datasource.username=${DATABASE_USERNAME:helper_oly}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Oly / OpenAI Responses API
oly.ai.enabled=${OLY_AI_ENABLED:true}
oly.ai.api-key=${OPENAI_API_KEY:}
oly.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
oly.ai.model=${OPENAI_MODEL:gpt-5.6-terra}
oly.ai.web-search-enabled=${OLY_WEB_SEARCH_ENABLED:true}
oly.timezone=${OLY_TIMEZONE:Europe/Amsterdam}

# Logging
logging.level.com.example.helper_bot_oly=${LOG_LEVEL:INFO}
logging.level.org.springframework.boot.autoconfigure.liquibase=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server
server.port=${SERVER_PORT:8082}
