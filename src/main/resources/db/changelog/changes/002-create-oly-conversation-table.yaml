databaseChangeLog:
  - changeSet:
      id: 002-create-oly-conversation-table
      author: oly
      changes:
        - createTable:
            tableName: oly_conversation
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: previous_response_id
                  type: VARCHAR(512)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: oly_conversation
            columnNames: chat_id
            constraintName: uk_oly_conversation_chat_id
